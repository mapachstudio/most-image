# Modificado por Grupo MOST para Most Image. Obra original: Most Image del equipo ArtCraft (https://github.com/storytold/photocraft), Apache-2.0.
[book]
authors = ["Most Image contributors"]
language = "en"
multilingual = false
src = "src"
title = "Most Image Documentation"

[build]
build-dir = "output"
create-missing = false

[output.html]
git-repository-icon = "fa-github"
git-repository-url = "https://github.com/storytold/photocraft"
edit-url-template = "https://github.com/storytold/photocraft/edit/main/book/{path}"
preferred-dark-theme = "navy"
smart-punctuation = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
